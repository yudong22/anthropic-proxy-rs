version: '3'

vars:
  APP_NAME: Anthropic Proxy
  APP_BIN: anthropic-proxy-gui
  BUNDLE_DIR: target/release/bundle/macos
  INSTALL_APP: /Applications/{{.APP_NAME}}.app

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Desktop app ──────────────────────────────────────────────────────────
  setup:
    desc: Install the pinned Tauri CLI (Node dev dependency)
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  dev:
    desc: Start the Tauri 2 GUI in development mode
    aliases: [gui-dev]
    deps: [setup]
    cmds:
      - npm run dev

  build:
    desc: Build the Tauri 2 GUI desktop app (.app)
    aliases: [gui-build]
    deps: [setup]
    cmds:
      - npm run build

  build-dmg:
    desc: Build the Tauri 2 GUI desktop installer (.dmg)
    aliases: [gui-build-dmg]
    deps: [setup]
    cmds:
      - npm run build:dmg

  install:
    desc: Build the .app and replace {{.INSTALL_APP}} (restarts it if running)
    aliases: [gui-install, local-install]
    deps: [build]
    cmds:
      - |
        TARGET_APP="{{.BUNDLE_DIR}}/{{.APP_NAME}}.app"

        WAS_RUNNING=0
        if pgrep -x "{{.APP_BIN}}" > /dev/null 2>&1 || pgrep -afil "{{.APP_NAME}}.app" > /dev/null 2>&1; then
          WAS_RUNNING=1
          echo "🔄 Stopping running {{.APP_NAME}}..."
          killall "{{.APP_BIN}}" 2>/dev/null || true
          pkill -afil "{{.APP_NAME}}.app" 2>/dev/null || true
          sleep 1
        fi

        echo "📦 Installing to {{.INSTALL_APP}}..."
        rm -rf "{{.INSTALL_APP}}"
        cp -R "${TARGET_APP}" "{{.INSTALL_APP}}"

        if [ $WAS_RUNNING -eq 1 ]; then
          echo "🚀 Restarting {{.APP_NAME}}..."
          open "{{.INSTALL_APP}}"
        fi
        echo "✅ Installed to {{.INSTALL_APP}}"

  uninstall:
    desc: Remove the installed desktop app
    cmds:
      - rm -rf "{{.INSTALL_APP}}"
      - echo "✅ Uninstalled {{.APP_NAME}}"

  # ── Quality gate ─────────────────────────────────────────────────────────
  fmt:
    desc: Format code
    cmds:
      - cargo fmt

  fmt-check:
    desc: Check code formatting
    cmds:
      - cargo fmt -- --check

  lint:
    desc: Run clippy linter
    cmds:
      - cargo clippy --all-targets -- -D warnings

  lint-fix:
    desc: Run clippy with auto-fix
    cmds:
      - cargo clippy --fix --allow-dirty --allow-staged

  test:
    desc: Run all tests
    cmds:
      - cargo test

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test -- --nocapture --test-threads=1

  check:
    desc: Run all checks (fmt, lint, test)
    cmds:
      - task: fmt-check
      - task: lint
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
      - echo "✅ Cleaned build artifacts"

  # ── Maintenance ──────────────────────────────────────────────────────────
  watch:
    desc: Watch and auto-restart the GUI on changes
    cmds:
      - cargo watch -x "run -p anthropic-proxy-gui"

  audit:
    desc: Check for security vulnerabilities
    cmds:
      - cargo audit

  update:
    desc: Update dependencies
    cmds:
      - cargo update

  outdated:
    desc: Check for outdated dependencies
    cmds:
      - cargo outdated

  tree:
    desc: Show dependency tree
    cmds:
      - cargo tree

  doc:
    desc: Generate and open documentation
    cmds:
      - cargo doc --open --no-deps

  bench:
    desc: Run benchmarks (if any)
    cmds:
      - cargo bench

  size:
    desc: Show the built binary size
    deps: [build]
    cmds:
      - ls -lh {{.BUNDLE_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_BIN}} | awk '{print "Binary size:", $5}'

  release:
    desc: Prepare a release (clean, check, build)
    cmds:
      - task: clean
      - task: check
      - task: build
      - task: size
      - echo "✅ Release app ready at {{.BUNDLE_DIR}}/{{.APP_NAME}}.app"

  help:
    desc: Show help information
    cmds:
      - echo "anthropic-proxy-rs - Anthropic API to OpenAI proxy (desktop app)"
      - echo ""
      - echo "Common tasks:"
      - echo "  task dev            - Start the GUI in development mode"
      - echo "  task build          - Build the .app bundle"
      - echo "  task build-dmg      - Build the .dmg installer"
      - echo "  task install        - Build and install to /Applications"
      - echo "  task test           - Run tests"
      - echo "  task check          - Run all checks"
      - echo "  task clean          - Clean build artifacts"
